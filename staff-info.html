<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍁.Nʌsʜʌ™.🍁 — Staff Info &amp; Discord IDs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
            script: ['Great Vibes', 'cursive'],
          }
        }
      }
    }
  </script>
</head>
<body class="antialiased selection:bg-cyan-400/30 selection:text-cyan-200">
  <header id="shared-navbar"></header>

  <main class="relative z-10 pt-28 pb-24 px-4 sm:px-6 max-w-7xl mx-auto">
    <div class="reveal-up text-center max-w-3xl mx-auto mb-12">
      <span class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-amber-500/10 border border-amber-400/25 text-amber-300 text-xs font-bold uppercase tracking-widest mb-3">
        <i class="fa-solid fa-crown"></i> Royal Ranks &amp; Discord IDs
      </span>
      <h1 class="font-display text-3xl sm:text-5xl font-extrabold text-white mb-3">
        Guardians of <span class="text-bio-gradient">🍁.Nʌsʜʌ™.🍁</span>
      </h1>
      <p class="text-sm text-slate-400">
        Ranks: <strong class="text-amber-300">.CHIEF.</strong> • <strong class="text-fuchsia-300">.DUCHESS.</strong> • <strong class="text-cyan-300">.SOORAN.</strong> • <strong class="text-emerald-300">.RICHY.</strong> — Click any Discord User ID to copy it.
      </p>
    </div>

    <div id="staff-page-grid" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
  </main>

  <script src="navbar.js"></script>
  <script>
    function renderStaffPage() {
      const grid = document.getElementById('staff-page-grid');
      grid.innerHTML = window.NASHA_STORE.staff.map(m => `
        <div class="tilt-card glass-card rounded-3xl p-6 text-center flex flex-col justify-between">
          <div>
            <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br ${m.badgeColor} p-[2px] mb-4">
              <div class="w-full h-full rounded-[14px] bg-[#060d20] flex items-center justify-center font-display font-extrabold text-xl text-white">
                ${m.name.replace(/[^A-Za-z]/g, '').charAt(0) || '🍁'}
              </div>
            </div>
            <span class="inline-block px-3 py-0.5 rounded-full bg-white/5 border border-white/10 text-[10px] font-extrabold tracking-widest text-amber-300 uppercase mb-2">
              .${m.rank}.
            </span>
            <h2 class="font-display font-bold text-lg text-white">${m.name}</h2>
            <p class="text-xs text-slate-400 mt-1 mb-4">${m.role}</p>
          </div>

          <button onclick="copyDiscordId('${m.discordId}', '${m.name}')" class="w-full py-2.5 px-3 rounded-xl bg-slate-950/80 hover:bg-cyan-500/15 border border-cyan-400/25 text-[11px] font-mono text-cyan-300 flex items-center justify-between transition cursor-pointer">
            <span class="truncate">ID: ${m.discordId}</span>
            <i class="fa-regular fa-copy ml-2 text-slate-400"></i>
          </button>
        </div>
      `).join('');

      attachTiltCards();
    }

    function copyDiscordId(id, name) {
      const input = document.createElement('input');
      input.value = id;
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      document.body.removeChild(input);
      showToast(`Copied ${name}'s Discord ID (${id})`);
    }

    document.addEventListener('DOMContentLoaded', renderStaffPage);
  </script>
</body>
</html>
