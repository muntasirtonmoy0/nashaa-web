<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍁.Nʌsʜʌ™.🍁 — Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
            script: ['Great Vibes', 'cursive'],
          }
        }
      }
    }
  </script>
</head>
<body class="antialiased selection:bg-cyan-400/30 selection:text-cyan-200">
  <header id="shared-navbar"></header>

  <main class="relative z-10 pt-28 pb-24 px-4 sm:px-6 max-w-7xl mx-auto">
    <div class="reveal-up text-center max-w-3xl mx-auto mb-12">
      <span class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-cyan-500/10 border border-cyan-400/25 text-cyan-300 text-xs font-bold uppercase tracking-widest mb-3">
        <i class="fa-solid fa-images"></i> #GALLERY Showcase
      </span>
      <h1 class="font-display text-3xl sm:text-5xl font-extrabold text-white mb-3">
        Bioluminescent <span class="text-bio-gradient">Server Gallery</span>
      </h1>
      <p class="text-sm text-slate-400">Click any visual card below to inspect it in full view.</p>
    </div>

    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div onclick="openGalleryBox('Enchanted Tree Emblem', 'Midnight Blue Canopy & Script Branding', 'from-blue-900 via-cyan-900 to-slate-950', 'Nasha™')" class="tilt-card glass-card rounded-3xl overflow-hidden cursor-pointer group">
        <div class="h-60 bg-gradient-to-br from-blue-900 via-cyan-900 to-slate-950 flex items-center justify-center">
          <span class="font-script text-6xl text-white text-nasha-glow">Nasha™</span>
        </div>
        <div class="p-5 flex items-center justify-between">
          <div>
            <h2 class="font-display font-bold text-white">Enchanted Tree Emblem</h2>
            <p class="text-xs text-slate-400">Server Theme &amp; Banner</p>
          </div>
          <i class="fa-solid fa-expand text-cyan-400"></i>
        </div>
      </div>

      <div onclick="openGalleryBox('#HEX & #RICH Palette', 'Custom Role Colors for Members & Boosters', 'from-indigo-950 via-sky-900 to-rose-950', '#00E5FF')" class="tilt-card glass-card rounded-3xl overflow-hidden cursor-pointer group">
        <div class="h-60 bg-gradient-to-br from-indigo-950 via-sky-900 to-rose-950 flex flex-col items-center justify-center gap-3">
          <div class="flex gap-2.5">
            <span class="w-9 h-9 rounded-full bg-[#00e5ff] shadow-[0_0_16px_#00e5ff]"></span>
            <span class="w-9 h-9 rounded-full bg-[#3b82f6] shadow-[0_0_16px_#3b82f6]"></span>
            <span class="w-9 h-9 rounded-full bg-[#a855f7] shadow-[0_0_16px_#a855f7]"></span>
            <span class="w-9 h-9 rounded-full bg-[#ef4444] shadow-[0_0_16px_#ef4444]"></span>
          </div>
          <span class="text-xs font-mono text-cyan-200">HEX &amp; RICH ROLES</span>
        </div>
        <div class="p-5 flex items-center justify-between">
          <div>
            <h2 class="font-display font-bold text-white">#HEX &amp; #RICH Palette</h2>
            <p class="text-xs text-slate-400">Role Swatches</p>
          </div>
          <i class="fa-solid fa-expand text-cyan-400"></i>
        </div>
      </div>

      <div onclick="openGalleryBox('Music vc & Game Nights', 'Late-Night Voice Lounges & Lineups', 'from-slate-900 via-blue-950 to-emerald-950', '🍁 VC 🍁')" class="tilt-card glass-card rounded-3xl overflow-hidden cursor-pointer group">
        <div class="h-60 bg-gradient-to-br from-slate-900 via-blue-950 to-emerald-950 flex flex-col items-center justify-center">
          <i class="fa-solid fa-headphones text-5xl text-cyan-300 mb-2"></i>
          <span class="text-xs font-semibold text-emerald-300">24/7 Voice Lounges</span>
        </div>
        <div class="p-5 flex items-center justify-between">
          <div>
            <h2 class="font-display font-bold text-white">Music vc &amp; Game Nights</h2>
            <p class="text-xs text-slate-400">Community Hangouts</p>
          </div>
          <i class="fa-solid fa-expand text-cyan-400"></i>
        </div>
      </div>
    </div>
  </main>

  <!-- Lightbox Modal -->
  <div id="gal-lightbox" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-950/90 backdrop-blur-lg" onclick="closeGalleryBox()">
    <div class="glass-card rounded-3xl max-w-2xl w-full p-6 border-cyan-400/40" onclick="event.stopPropagation()">
      <div id="gal-box-bg" class="h-72 rounded-2xl bg-gradient-to-br from-blue-900 to-slate-950 flex items-center justify-center mb-5">
        <span id="gal-box-art" class="font-script text-7xl text-white text-nasha-glow">Nasha™</span>
      </div>
      <div class="flex items-center justify-between">
        <div>
          <h3 id="gal-box-title" class="font-display font-bold text-xl text-white"></h3>
          <p id="gal-box-desc" class="text-xs text-slate-300 mt-1"></p>
        </div>
        <button onclick="closeGalleryBox()" class="px-4 py-2 rounded-xl bg-white/10 text-xs font-bold text-white cursor-pointer">Close</button>
      </div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="auth-modal.js"></script>
  <script src="navbar.js"></script>
  <script>
    function openGalleryBox(title, desc, grad, art) {
      const box = document.getElementById('gal-lightbox');
      document.getElementById('gal-box-title').textContent = title;
      document.getElementById('gal-box-desc').textContent = desc;
      document.getElementById('gal-box-art').textContent = art;
      document.getElementById('gal-box-bg').className = `h-72 rounded-2xl bg-gradient-to-br ${grad} flex items-center justify-center mb-5`;
      box.classList.remove('hidden');
      box.classList.add('flex');
    }
    function closeGalleryBox() {
      const box = document.getElementById('gal-lightbox');
      box.classList.add('hidden');
      box.classList.remove('flex');
    }
  </script>
</body>
</html>
